[project]
name = "ptcg-ai"
version = "0.1.0"
description = "Research framework for the Pokémon TCG AI Battle Challenge (Kaggle 'cabt' simulator)."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "pyyaml>=6.0",
    # NOTE: kaggle-environments (the "cabt" env host) is intentionally NOT a
    # dependency: every release containing cabt requires Python >=3.11 and
    # open_spiel, which has no Windows wheels. Install it manually in a
    # separate Linux/WSL Python 3.11+ venv for submission-fidelity runs.
    # See docs/environment.md.
]

[project.scripts]
ptcg = "ptcg_ai.cli:main"

[dependency-groups]
dev = [
    "numpy>=2.2.6",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "requests>=2.31",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ptcg_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "sdk: requires the native cabt engine library (skipped when unavailable)",
]
